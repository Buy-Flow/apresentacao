<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2ed"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/styles.css"><title>Product — Can't Hide Pretty</title></head><body><div id="siteHeader"></div><main class="page"><section class="product-page"><div class="wrap"><a href="shop.html" class="backlink">← Back to shop</a><div class="product-layout" id="productMount"></div></div></section><section class="section alt"><div class="wrap"><div class="section-head"><div><span class="kicker">You may also like</span><h2>Complete the edit.</h2></div></div><div class="product-rail" id="related"></div></div></section></main><div id="siteFooter"></div><script src="assets/js/products.js"></script><script src="assets/js/components.js"></script><script>siteHeader.innerHTML=CHP_COMPONENTS.chpHeader('Shop');siteFooter.innerHTML=CHP_COMPONENTS.chpFooter();</script><script src="assets/js/app.js"></script><script>const id=new URLSearchParams(location.search).get('id')||CHP.P[0].id,p=CHP.product(id)||CHP.P[0];document.title=p.name+" — Can't Hide Pretty";productMount.innerHTML=`<div class="product-gallery"><div class="gallery-tile gallery-main"><img src="${p.image}" alt="${p.name}" onerror="this.parentElement.classList.add('image-fallback');this.style.display='none'"></div><div class="gallery-tile gallery-detail"><img src="${p.image}" alt="${p.name} detail" onerror="this.parentElement.classList.add('image-fallback');this.style.display='none'"></div><div class="gallery-tile gallery-detail" style="background:#ded3cc;display:grid;place-items:center;padding:24px;text-align:center"><span style="font:500 34px var(--serif)">Be your own kind of beautiful.</span></div></div><div class="product-info"><span class="badge">${p.badge}</span><h1>${p.name}</h1><div class="price">${CHP.money(p.price)}</div><p class="description">${p.description}</p><div class="option-label">Color · ${p.color}</div><div class="option-label">Select size</div><div class="sizes" id="productSizes">${p.sizes.map((s,i)=>`<button class="size ${i===0?'active':''}" data-size="${s}">${s}</button>`).join('')}</div><button class="btn primary" id="productAdd" style="width:100%">Add to bag — ${CHP.money(p.price)}</button><div class="trust"><div>Free shipping<br>on $100+</div><div>Local pickup<br>Panama City</div><div>Secure checkout<br>ready to connect</div></div><div style="margin-top:18px"><details open><summary>Product details</summary><p>${p.description}</p></details><details><summary>Shipping & pickup</summary><p>Standard orders are processed before shipping, and local pickup is available through the boutique. Final production checkout can connect directly to Shopify.</p></details><details><summary>Returns</summary><p>The current boutique policy offers exchanges or store credit for eligible items returned in original condition within the stated return window.</p></details></div></div>`;let selected=p.sizes[0];productSizes.querySelectorAll('.size').forEach(b=>b.onclick=()=>{selected=b.dataset.size;productSizes.querySelectorAll('.size').forEach(x=>x.classList.toggle('active',x===b))});productAdd.onclick=()=>{CHP.add(p.id,selected);CHP.openDrawer()};related.innerHTML=CHP.P.filter(x=>x.id!==p.id).slice(0,5).map(CHP_COMPONENTS.productCard).join('');related.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{e.preventDefault();CHP.add(b.dataset.add)});related.querySelectorAll('[data-wish]').forEach(b=>b.onclick=e=>{e.preventDefault();CHP.toggleWish(b.dataset.wish)});</script></body></html>
