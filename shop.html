<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop All — Can't Hide Pretty</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Permanent+Marker&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/styles.css"></head><body><div id="siteHeader"></div><main class="page"><section class="page-hero"><div class="wrap"><span class="kicker">come find your pretty</span><h1>Shop all</h1><p>Search by product, category or mood. Discovery can be expressive without making shopping difficult.</p></div></section><section class="section" style="padding-top:20px"><div class="wrap"><div class="shop-toolbar"><div class="searchbox"><input id="shopSearch" type="search" placeholder="Search dresses, jewelry, game day..."></div><div class="filters" id="filters"></div></div><div class="product-grid" id="shopGrid"></div><div id="empty" style="display:none;text-align:center;padding:60px"><h2 class="display">No pretty found.</h2></div></div></section></main><div id="siteFooter"></div><script src="assets/js/products.js"></script><script src="assets/js/components.js"></script><script>siteHeader.innerHTML=CHP_COMPONENTS.chpHeader('Shop');siteFooter.innerHTML=CHP_COMPONENTS.chpFooter()</script><script src="assets/js/app.js"></script><script>const grid=document.getElementById('shopGrid'),filters=document.getElementById('filters'),q=document.getElementById('shopSearch'),cats=['All',...new Set(CHP.P.map(p=>p.category))];let active=new URLSearchParams(location.search).get('cat')||'All',mood=new URLSearchParams(location.search).get('mood');filters.innerHTML=cats.map(c=>`<button class="filter ${c===active?'active':''}" data-f="${c}">${c}</button>`).join('');function paint(){let s=q.value.toLowerCase(),list=CHP.P.filter(p=>(active==='All'||p.category===active)&&(!mood||p.mood===mood)&&(!s||(`${p.name} ${p.category} ${p.mood}`).toLowerCase().includes(s)));if(location.hash==='#saved')list=list.filter(p=>CHP.store.wish.includes(p.id));grid.innerHTML=list.map(CHP_COMPONENTS.productCard).join('');empty.style.display=list.length?'none':'block';grid.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{e.preventDefault();CHP.add(b.dataset.add)});grid.querySelectorAll('[data-wish]').forEach(b=>b.onclick=e=>{e.preventDefault();CHP.toggleWish(b.dataset.wish);if(location.hash==='#saved')paint()})}filters.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{active=b.dataset.f;filters.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));paint()});q.oninput=paint;addEventListener('hashchange',paint);paint()</script></body></html>
