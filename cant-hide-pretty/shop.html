<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2ed"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/styles.css"><title>Shop — Can't Hide Pretty</title><meta name="description" content="Shop the Can't Hide Pretty boutique edit."></head><body><div id="siteHeader"></div><main class="page"><section class="page-hero"><div class="wrap"><span class="kicker">The collection</span><h1>Shop</h1><p>Browse the current catalog preview by category, search or mood. The layout stays clean so the product can do the work.</p></div></section><section class="section" style="padding-top:20px"><div class="wrap"><div class="shop-toolbar"><div class="searchbox"><input id="shopSearch" type="search" placeholder="Search the collection"></div><div class="filters" id="filters"></div></div><div class="product-grid" id="shopGrid"></div><div class="empty-state" id="emptyState"><h2 class="display">Nothing found.</h2><p>Try another search or category.</p></div></div></section></main><div id="siteFooter"></div><script src="assets/js/products.js"></script><script src="assets/js/components.js"></script><script>siteHeader.innerHTML=CHP_COMPONENTS.chpHeader('Shop');siteFooter.innerHTML=CHP_COMPONENTS.chpFooter();</script><script src="assets/js/app.js"></script><script>const grid=shopGrid,filtersEl=filters,q=shopSearch,empty=emptyState;const cats=['All',...new Set(CHP.P.map(p=>p.category))];let active='All';filtersEl.innerHTML=cats.map(c=>`<button class="filter ${c==='All'?'active':''}" data-filter="${c}">${c}</button>`).join('');const params=new URLSearchParams(location.search);if(params.get('cat')&&cats.includes(params.get('cat')))active=params.get('cat');const mood=params.get('mood');function paint(){const s=q.value.trim().toLowerCase();let list=CHP.P.filter(p=>(active==='All'||p.category===active)&&(!mood||p.mood===mood)&&(!s||p.name.toLowerCase().includes(s)||p.category.toLowerCase().includes(s)||p.mood.toLowerCase().includes(s)));if(location.hash==='#saved')list=list.filter(p=>CHP.store.wish.includes(p.id));grid.innerHTML=list.map(CHP_COMPONENTS.productCard).join('');empty.classList.toggle('show',!list.length);grid.querySelectorAll('[data-wish]').forEach(b=>b.onclick=e=>{e.preventDefault();CHP.toggleWish(b.dataset.wish);if(location.hash==='#saved')paint()});grid.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{e.preventDefault();CHP.add(b.dataset.add)})}filtersEl.querySelectorAll('.filter').forEach(b=>{if(b.dataset.filter===active){filtersEl.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active')}b.onclick=()=>{active=b.dataset.filter;filtersEl.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));paint()}});q.oninput=paint;addEventListener('hashchange',paint);paint();</script></body></html>
