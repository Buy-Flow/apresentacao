<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — Can't Hide Pretty</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Permanent+Marker&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/styles.css"></head><body><div id="siteHeader"></div><main class="page"><section class="product-page"><div class="wrap"><a href="shop.html" class="kicker">← back to all pretties</a><div class="product-layout" id="mount"></div></div></section><section class="section alt"><div class="wrap"><div class="section-head"><div><span class="kicker">she needs friends</span><h2 class="display">Complete the vibe.</h2></div></div><div class="product-rail" id="related"></div></div></section></main><div id="siteFooter"></div><script src="assets/js/products.js"></script><script src="assets/js/components.js"></script><script>siteHeader.innerHTML=CHP_COMPONENTS.chpHeader('Shop');siteFooter.innerHTML=CHP_COMPONENTS.chpFooter()</script><script src="assets/js/app.js"></script><script>const id=new URLSearchParams(location.search).get('id')||CHP.P[0].id,p=CHP.product(id)||CHP.P[0];document.title=p.name+" — Can't Hide Pretty";mount.innerHTML=`<div class="product-gallery"><div class="gallery-tile gallery-main"><img src="${p.image}" alt="${p.name}"></div><div class="gallery-tile"><img src="${p.image}" alt="${p.name} detail"></div><div class="gallery-tile gallery-art"><span>${p.mood}<br>✦</span></div></div><div class="product-info"><span class="badge">${p.badge}</span><h1>${p.name}</h1><div class="price">${CHP.money(p.price)}</div><p class="section-copy">${p.description}</p><div class="kicker" style="margin-top:24px">Color · ${p.color}</div><div class="sizes" id="sizes">${p.sizes.map((s,i)=>`<button class="size ${i?'':'active'}" data-size="${s}">${s}</button>`).join('')}</div><button class="btn primary" id="add" style="width:100%">Add to bag — ${CHP.money(p.price)} →</button><div class="trust"><div>Worldwide<br>shipping</div><div>Local pickup<br>available</div><div>Shopify-ready<br>checkout</div></div><details open><summary>The pretty details</summary><p>${p.description}</p></details><details><summary>Shipping & returns</summary><p>Final live rules remain controlled by Shopify so inventory, rates and policy stay accurate.</p></details></div>`;let selected=p.sizes[0];sizes.querySelectorAll('.size').forEach(b=>b.onclick=()=>{selected=b.dataset.size;sizes.querySelectorAll('.size').forEach(x=>x.classList.toggle('active',x===b))});add.onclick=()=>{CHP.add(p.id,selected);CHP.openDrawer()};related.innerHTML=CHP.P.filter(x=>x.id!==p.id).slice(0,6).map(CHP_COMPONENTS.productCard).join('');related.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{e.preventDefault();CHP.add(b.dataset.add)});related.querySelectorAll('[data-wish]').forEach(b=>b.onclick=e=>{e.preventDefault();CHP.toggleWish(b.dataset.wish)})</script></body></html>
